<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Outer Espresso Background -->
  <rect width="64" height="64" rx="14" fill="#1A130E"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="11.5" fill="none" stroke="#70C685" stroke-width="2.5"/>
  
  <!-- Steaming Wheat / Grain Sprout (Botanical Green & Cream) -->
  <path d="M32 26 V12" stroke="#70C685" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="28" cy="15" rx="3.5" ry="2" transform="rotate(-30 28 15)" fill="#70C685"/>
  <ellipse cx="36" cy="15" rx="3.5" ry="2" transform="rotate(30 36 15)" fill="#FAF8F2"/>
  <ellipse cx="29" cy="20" rx="3.5" ry="2" transform="rotate(-25 29 20)" fill="#FAF8F2"/>
  <ellipse cx="35" cy="20" rx="3.5" ry="2" transform="rotate(25 35 20)" fill="#70C685"/>
  <ellipse cx="32" cy="10" rx="2" ry="3" fill="#FAF8F2"/>
  
  <!-- Coffee Cup Body (Warm Cream) -->
  <path d="M19 28 H45 C45 28 44 46 32 46 C20 46 19 28 19 28 Z" fill="#F6F2E9"/>
  
  <!-- Cup Handle -->
  <path d="M44 31 C49 31 51 34 51 38 C51 42 47 43 43 43" fill="none" stroke="#F6F2E9" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Coffee Bean Emblem on Cup (Espresso with Green Seam) -->
  <ellipse cx="32" cy="37" rx="5.5" ry="4" fill="#1A130E"/>
  <path d="M30 34.5 Q33 37 34 39.5" fill="none" stroke="#70C685" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Base Saucer Line -->
  <line x1="22" y1="51" x2="42" y2="51" stroke="#FAF8F2" stroke-width="3" stroke-linecap="round"/>
</svg>

